<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Домашние церкви · Администратор</title>
<style>body{font:16px system-ui;background:#f5f4ef;color:#202720;margin:0}main{max-width:1100px;margin:auto;padding:30px 20px}h1{font-size:32px}section{background:white;padding:24px;border-radius:16px;margin:20px 0}button{background:#245940;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;margin:4px}input,textarea,select{font:inherit;padding:9px;border:1px solid #aaa;border-radius:6px;max-width:100%;box-sizing:border-box}label{display:grid;gap:5px;margin:10px 0}textarea{min-height:85px}form{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}form h3,.wide{grid-column:1/-1}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd;vertical-align:top}.scroll{overflow:auto}.muted{color:#58635b}#notice{position:sticky;top:0;background:#fff2cc;padding:12px;display:none;z-index:2}small{display:block}button.secondary{background:#e7eee8;color:#173923}@media(max-width:650px){form{display:block}section{padding:14px}}</style>
<main><h1>Домашние церкви</h1><p class="muted">Управление каталогом и заявками. Тестовые группы отмечены отдельно.</p><div id="notice" role="status"></div>
<section><h2>Заявки</h2><select id="status" aria-label="Статус заявок"><option value="">Все статусы</option><option value="new">Новые</option><option value="contacted">Связались</option><option value="closed">Закрытые</option></select><button id="refresh">Обновить</button><div class="scroll"><table><thead><tr><th>Дата / №</th><th>Человек</th><th>Церковь</th><th>Статус</th></tr></thead><tbody id="requests"></tbody></table></div><p id="empty"></p><button id="prev" class="secondary">← Назад</button><span id="page"></span><button id="next" class="secondary">Далее →</button></section>
<section><h2>Церкви</h2><button id="new">Добавить церковь</button><div id="churches"></div><form id="editor" hidden><h3 id="formTitle"></h3><label>Название<input name="name" required maxlength="120"></label><label>Район<input name="district" required maxlength="120"></label><label>Лидер<input name="leader" required maxlength="120"></label><label>Telegram лидера (без @, необязательно)<input name="leader_username" pattern="[A-Za-z][A-Za-z0-9_]{4,31}" maxlength="32"></label><label>Адрес<input name="address" required maxlength="300"></label><label>День и время встречи<input name="meeting" required maxlength="160"></label><label>Возраст участников<input name="age" required maxlength="80"></label><label>Количество участников<input name="participants" type="number" min="0" max="10000" required></label><label>Широта<input name="lat" type="number" min="-90" max="90" step="any" required></label><label>Долгота<input name="lon" type="number" min="-180" max="180" step="any" required></label><label class="wide">Интересы через запятую<input name="interests" maxlength="900"></label><label class="wide">Описание<textarea name="description" required maxlength="3000"></textarea></label><label>Тестовая группа<input name="is_test" type="checkbox"></label><label>Показывать в каталоге<input name="active" type="checkbox"></label><div class="wide"><button type="submit">Сохранить</button><button id="cancel" type="button" class="secondary">Закрыть</button><p class="muted">Чтобы скрыть группу, снимите «Показывать в каталоге». Её заявки сохранятся.</p></div></form></section></main>
<script>
const el=id=>document.getElementById(id),form=el('editor');let offset=0,editing=null;
const statuses={new:'Новая',contacted:'Связались',closed:'Закрыта'};
function notice(s){el('notice').textContent=s;el('notice').style.display='block'}
async function api(url,method='GET',data){const r=await fetch(url,{method,headers:{'Content-Type':'application/json','X-Admin-Request':'1'},body:data?JSON.stringify(data):undefined});if(!r.ok)throw Error(await r.text());return r.json()}
function cell(row,text){const td=document.createElement('td');td.textContent=text;row.append(td);return td}
async function loadRequests(){try{const rows=await api(`/api/requests?offset=${offset}&limit=25&status=${el('status').value}`);el('requests').replaceChildren();for(const r of rows){const tr=document.createElement('tr');cell(tr,`${new Date(r.created_at).toLocaleString('ru-RU')} / ${r.id}`);const who=cell(tr,r.name);const link=document.createElement('a');link.textContent=r.username?'@'+r.username:'Telegram ID '+r.telegram_id;link.href=r.username?'https://t.me/'+encodeURIComponent(r.username):'tg://user?id='+r.telegram_id;who.append(document.createElement('br'),link);cell(tr,r.church_name+(r.is_test?' · тестовая':''));const td=cell(tr,'');const select=document.createElement('select');for(const [v,t] of Object.entries(statuses)){const option=new Option(t,v);select.append(option)}select.value=r.status;select.onchange=async()=>{try{await api('/api/requests/'+r.id,'PATCH',{status:select.value});notice('Статус сохранён');await loadRequests()}catch(e){notice(e.message);select.value=r.status}};td.append(select);el('requests').append(tr)}el('empty').textContent=rows.length?'':'Заявок пока нет.';el('prev').disabled=offset===0;el('next').disabled=rows.length<25;el('page').textContent='Страница '+(offset/25+1)}catch(e){notice(e.message)}}
async function loadChurches(){try{const rows=await api('/api/admin/churches');el('churches').replaceChildren();for(const c of rows){const p=document.createElement('p');p.textContent=c.name+' · '+c.district+(c.is_test?' · тестовая':'')+(c.active?'':' · скрыта');const b=document.createElement('button');b.textContent='Редактировать';b.className='secondary';b.onclick=()=>edit(c);p.append(b);el('churches').append(p)}}catch(e){notice(e.message)}}
function edit(c){editing=c?.id??null;form.hidden=false;form.style.display='grid';el('formTitle').textContent=c?'Редактирование: '+c.name:'Новая церковь';for(const input of form.elements){if(!input.name)continue;const value=c?.[input.name];if(input.type==='checkbox')input.checked=value??true;else input.value=Array.isArray(value)?value.join(', '):(value??'')}form.scrollIntoView({behavior:'smooth'})}
function closeForm(){form.hidden=true;form.style.display='none'}closeForm();
form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('[type=submit]');b.disabled=true;try{const data=Object.fromEntries(new FormData(form));data.participants=Number(data.participants);data.lat=Number(data.lat);data.lon=Number(data.lon);data.interests=data.interests.split(',').map(s=>s.trim()).filter(Boolean);data.leader_username=data.leader_username||null;data.is_test=form.elements.is_test.checked;data.active=form.elements.active.checked;await api('/api/admin/churches'+(editing?'/'+editing:''),editing?'PUT':'POST',data);notice('Церковь сохранена');closeForm();await loadChurches()}catch(e){notice(e.message)}finally{b.disabled=false}};
el('cancel').onclick=closeForm;el('new').onclick=()=>edit(null);el('refresh').onclick=loadRequests;el('status').onchange=()=>{offset=0;loadRequests()};el('prev').onclick=()=>{offset=Math.max(0,offset-25);loadRequests()};el('next').onclick=()=>{offset+=25;loadRequests()};loadRequests();loadChurches();
</script></html>
